<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Brent's Toy Collection</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: #f4ead5;
            color: #222;
            line-height: 1.6;
        }

        /* HEADER */

        header {
            background-color: #171717;
            color: white;
            text-align: center;
            padding: 40px 20px;
            border-bottom: 8px solid #ff5c00;
        }
        header h1 {
            color: #ff5c00;
            font-size: 42px;
            margin: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow:
                3px 3px 0px white,
                6px 6px 0px black;
            transition: 0.3s;
        }
        header h1:hover {
            transform: scale(1.03);
            text-shadow:
                3px 3px 0px white,
                6px 6px 0px black,
                0 0 25px #ff5c00;
        }
        header p {
            font-size: 17px;
        }

        /* NAVIGATION */

        nav {
            margin-top: 25px;
        }
        nav a {
            display: inline-block;
            background-color: #ff5c00;
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            margin: 5px;
            border-radius: 25px;
            border: 2px solid white;
            font-weight: bold;
            transition: 0.3s;
        }
        nav a:hover {
            background-color: white;
            color: #ff5c00;
            border-color: #ff5c00;
            transform: translateY(-4px);
            box-shadow:
                0 0 10px #ff5c00,
                0 0 20px #ff5c00;
        }

        /* MAIN */

        main {
            max-width: 850px;

            margin: 50px auto;

            padding: 0 25px;
        }


        /* CONTACT CARD */

        .contact-card {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            border: 4px solid #171717;
            box-shadow: 10px 10px 0px #ff5c00;
            transition: 0.3s;
        }
        .contact-card:hover {
            box-shadow:
                14px 16px 0px #ff5c00,
                0 15px 30px rgba(0, 0, 0, 0.2);
        }
        .contact-card h2 {
            color: #ff5c00;
            text-align: center;
            font-size: 34px;
            text-transform: uppercase;
            margin-top: 0;
            transition: 0.3s;
        }
        .contact-card h2:hover {
            text-shadow:
                0 0 5px #ff5c00,
                0 0 15px #ff5c00,
                0 0 25px #ff5c00;
        }
        .contact-intro {
            text-align: center;

            margin-bottom: 30px;
        }


        /* FIELDSET */

        fieldset {
            border: 3px solid #171717;
            border-radius: 15px;
            padding: 25px;
            margin: 0;
        }
        legend {
            background-color: #171717;
            color: #ff5c00;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }


        /* FORM */

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #171717;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #171717;
            border-radius: 8px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            background-color: #fff;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #ff5c00;
            box-shadow:
                0 0 5px #ff5c00,
                0 0 12px rgba(255, 92, 0, 0.4);
        }
        textarea {
            min-height: 160px;
            resize: vertical;
        }


        /* SEND MESSAGE BUTTON */

        .button-container {
            text-align: center;
            margin-top: 30px;
        }
        button {
            background-color: #ff5c00;
            color: white;
            border: 3px solid #171717;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #171717;
            color: #ff5c00;
            border-color: #ff5c00;
            transform: translateY(-4px);
            box-shadow:
                0 0 10px #ff5c00,
                0 0 20px #ff5c00;
        }
        button:focus {
            outline: 3px solid #ff5c00;
            outline-offset: 4px;
        }


        /* FOOTER */

        footer {
            margin-top: 70px;
            background-color: #171717;
            color: white;
            text-align: center;
            padding: 30px;
            border-top: 8px solid #ff5c00;
        }
        footer span {
            color: #ff5c00;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header>
        <h1>Brent's Toy Collection</h1>
        <p>
            Your Next Favorite Find • Rare • Unique • Collectible
        </p>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="contact-card">
            <h2>Contact Us</h2>
            <p class="contact-intro">
                Have a question about one of our collectibles?
                Want to know more about a product?
                Send us a message!
            </p>

            <!-- CONTACT FORM -->
            <form>
                <fieldset>
                    <legend>Your Details</legend>

                    <!-- NAME -->
                    <label for="name">
                        Name
                    </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                    <!-- EMAIL -->
                    <label for="email">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                    <!-- SUBJECT -->
                    <label for="subject">
                        Subject
                    </label>
                    <select
                        id="subject"
                        name="subject"
                        required
                    >
                        <option value="">
                            Choose a subject
                        </option>

                        <option value="product-question">
                            Product Question
                        </option>

                        <option value="order-status">
                            Order Status
                        </option>

                        <option value="availability">
                            Product Availability
                        </option>

                        <option value="collection">
                            Collection Inquiry
                        </option>

                        <option value="other">
                            Something Else
                        </option>
                    </select>

                    <!-- MESSAGE -->
                    <label for="message">
                        Message
                    </label>
                    <textarea
                        id="message"
                        name="message"
                        required
                    ></textarea>
                </fieldset>

                <!-- SEND BUTTON -->
                <div class="button-container">
                    <button type="submit">
                        Send Message
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>
            © 2026
            <span>Brent's Toy Collection</span>
            • Built for Toy Lovers
        </p>
    </footer>
</body>
</html>
